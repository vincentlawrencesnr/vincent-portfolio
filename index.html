<!-- Let's understand every one of them.
1. Description
<meta
  name="description"
  content="Vincent Lawrence is a Software Developer..."
/>

This is the summary that search engines often display under your page title.

For example, on Google:

Vincent Lawrence | Software Developer

Vincent Lawrence is a Software Developer
specializing in React, Java, C#, and modern web
applications.

The description helps people decide whether to click your site.

2. Keywords
<meta
  name="keywords"
  content="React, Java, Portfolio..."
/>

Years ago, search engines relied heavily on this.

Today, Google mostly ignores it for ranking, but it's harmless to include and some smaller search engines still consider it.

3. Author
<meta
  name="author"
  content="Vincent Lawrence"
/>

This identifies who created the page.

4. Viewport
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
/>

This tells mobile browsers:

"Render this page using the device's actual width and don't zoom it out by default."

Without it, your responsive layout could appear tiny on phones.

5. Theme Color
<meta
  name="theme-color"
  content="#3B82F6"
/>

On many Android browsers, the browser UI (such as the address bar) adopts this color when your site is open, matching your portfolio's branding.

Bonus: Open Graph Tags

These control how your portfolio looks when someone shares the link on platforms like LinkedIn, Facebook, WhatsApp, or Discord.
